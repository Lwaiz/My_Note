<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leo's Blog</title>
  <link rel="stylesheet" href="assets/style.css">
  <!-- 网站图标设置 -->
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
</head>
<body>
  <div id="page-background"></div>
  <header class="site-header">
    <div class="site-header-top">
      <div class="site-brand">
        <h1 class="brand-title">
          <img src="assets/images/avatar.png" alt="Leo 头像" class="brand-avatar">
          <span>Leo's Blog</span>
        </h1>
      </div>
      <div class="site-actions">
        <nav class="site-nav" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="#series">系列</a>
          <a href="#archive">归档</a>
          <a href="#categories">分类</a>
          <a href="pyq.html">随笔</a>
          <a href="#friends">友情链接</a>
        </nav>
        <div class="header-tools">
          <button type="button" id="theme-toggle" class="theme-btn" aria-label="切换主题模式" title="切换主题模式">☀</button>
          <label class="search-wrap" for="site-search">
            <input type="search" id="site-search" placeholder="搜索文章..." aria-label="搜索文章">
          </label>
          <a href="profile.html" class="profile-link">个人中心</a>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="intro">
      <h2>文章列表</h2>
      <div id="series-filter" class="series-filter">
        <button class="filter-btn filter-btn-active" data-series="all">全部</button>
      </div>
      <div id="post-list" class="post-list">正在加载文章...</div>
      <!-- 👇 新增：展开/收起按钮（必须加！） -->
      <div class="post-controls">
        <button id="toggle-posts-btn" class="toggle-btn">查看更多文章</button>
      </div>
    </section>

    <section id="series" class="site-section">
      <h2>系列</h2>
      <div id="series-list" class="section-grid">
        <p>正在加载系列信息...</p>
      </div>
    </section>

    <section id="archive" class="site-section">
      <h2>归档</h2>
      <div id="archive-list" class="section-grid">
        <p>正在加载归档...</p>
      </div>
    </section>

    <section id="categories" class="site-section">
      <h2>分类</h2>
      <div id="categories-list" class="section-grid">
        <p>正在加载分类...</p>
      </div>
    </section>

    <section id="friends" class="site-section">
      <h2>友情链接</h2>
      <div class="friend-links">
        <a href="https://github.com" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://www.csdn.net/" target="_blank" rel="noreferrer">CSDN</a>
        <a href="https://developer.mozilla.org" target="_blank" rel="noreferrer">MDN</a>
        <a href="https://css-tricks.org.cn/" target="_blank" rel="noreferrer">CSS-Tricks</a>
        <a href="https://www.oceanbase.com" target="_blank" rel="noreferrer">OceanBase</a>
        <a> 更多链接敬请期待...</a>
      </div>
    </section>

    <section id="profile" class="site-section">
      <h2>个人中心</h2>
      <p><a href="profile.html" class="back-to-list-button">进入个人中心</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>使用 GitHub Pages 的静态博客演示</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/music_player.js"></script>
  <script src="assets/switch_bg.js"></script>
  <!-- 背景图片切换控件 -->
  <script>
  fetch('assets/switch_bg.html')
    .then(res => res.text())
    .then(html => {
      document.body.insertAdjacentHTML('beforeend', html)
      initBgSwitch();
    })
  </script>
