<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章阅读 - Leo's Blog</title>
  <link rel="stylesheet" href="assets/style.css">
  <!-- 网站图标设置 -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>
  <div id="page-background"></div>
  <header class="site-header">
    <div class="site-header-top post-header-top">
      <div class="site-brand">
        <h1 class="brand-title">
          <a href="index.html" class="brand-link">
            <img src="avatar.png" alt="Leo 头像" class="brand-avatar">
            <span>Leo's Blog</span>
          </a>
        </h1>
      </div>
      <div class="site-actions">
        <nav class="site-nav" aria-label="文章页导航">
          <a href="index.html">文章</a>
          <a href="index.html#series">系列</a>
          <a href="index.html#archive">归档</a>
          <a href="index.html#categories">分类</a>
          <a href="index.html#friends">友情链接</a>
        </nav>
        <div class="header-tools">
          <button type="button" id="theme-toggle" class="theme-btn" aria-label="切换主题模式" title="切换主题模式">☀</button>
        </div>
      </div>
    </div>
  </header>

  <main class="content post-content">
    <aside class="post-sidebar">
      <section class="toc-section">
        <details open>
          <summary>文章目录</summary>
          <nav id="post-toc" class="toc-nav"><p>正在生成目录...</p></nav>
        </details>
      </section>
      <section class="post-profile-card">
        <a href="profile.html" class="post-profile-link">
          <div class="post-profile">
            <span class="post-profile-icon" aria-hidden="true">🌐</span>
            <span class="post-profile-title">个人中心</span>
          </div>
          <span class="post-profile-desc">查看个人主页入口</span>
        </a>
      </section>
    </aside>
    <article id="article">
      <div id="post-meta" class="post-meta"></div>
      <div id="markdown-content" class="markdown-body">正在加载文章...</div>
    </article>
  </main>

  <footer class="site-footer">
    <p>使用 GitHub Pages 的静态博客演示</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/music_player.js"></script>
  <script src="assets/switch_bg.js"></script>
  

  <!-- 背景图片切换控件 -->
  <div class="bg-switch">
    <button id="bgToggleBtn">🎨</button>
    <div id="bgPanel" class="bg-panel">
      <div class="bg-option" data-url="assets/background/buddy_bg.jpg"></div>
      <div class="bg-option" data-url="assets/background/bg1.png"></div>
      <div class="bg-option" data-url="assets/background/bg2.png"></div>
      <div class="bg-option" data-url="assets/background/bg3.png"></div>
      <div class="bg-option" data-url="assets/background/bg4.png"></div>
      <div class="bg-option" data-url="assets/background/bg5.png"></div>
    </div>
  </div>
</body>
</html>
