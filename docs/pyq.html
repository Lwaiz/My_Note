<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随笔 · Leo's Blog</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/favicon.png">
  <style>
    .moment-card {
      padding: 16px;
      margin-bottom: 16px;
      background: var(--panel-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .moment-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .moment-avatar {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }
    .moment-name {
      font-weight: 600;
      color: var(--primary);
      font-size: 16px;
    }
    .moment-text {
      line-height: 1.6;
      margin-bottom: 2px;
      white-space: pre-wrap;
    }
    /* 🔥 强制修复 markdown 文本间距 */
    .moment-text p {
      margin: 0 !important;
      padding: 0 !important;
    }
    .moment-time {
      font-size: 13px;
      color: var(--muted);
      margin-top: 20px;
    }
    .moment-images {
      display: grid;
      gap: 8px;
      margin: 2px 0;
    }
    .moment-images.img-1 { grid-template-columns: 1fr; max-width: 45%; margin: 0 auto;}
    .moment-images.img-2,.moment-images.img-4 { grid-template-columns: 1fr 1fr; max-width: 90%; margin: 0 auto;}
    .moment-images.img-3,.moment-images.img-5,.moment-images.img-6,.moment-images.img-7,.moment-images.img-8,.moment-images.img-9 { grid-template-columns: 1fr 1fr 1fr; }
    .moment-images img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      transition: transform .2s;
    }
    .moment-images img:hover { transform: scale(1.02); }
    .img-preview-mask {
      position: fixed; top:0; left:0; width:100vw; height:100vh;
      background:rgba(124, 124, 124, 0.6); z-index:99999; display:none;
      align-items:center; justify-content:center; padding:20px;
    }
    .img-preview-mask.show { display:flex; }
    .img-preview-mask img { max-width:90%; max-height:90%; border-radius:8px; object-fit:contain; }
  </style>
</head>
<body>
  <div id="page-background"></div>
  <div class="img-preview-mask" id="imgPreviewMask">
    <div class="preview-btn prev-btn" onclick="prevImage()">‹</div>
      <img id="previewImg" alt="预览">
    <div class="preview-btn next-btn" onclick="nextImage()">›</div>
    <!-- 新增提示文字 -->
    <div class="preview-tip" id="previewTip"></div>
  </div>

  <header class="site-header">
    <div class="site-header-top post-header-top">
      <div class="site-brand">
        <h1 class="brand-title">
          <a href="index.html" class="brand-link">
            <img src="assets/images/avatar.png" class="brand-avatar">
            <span>Leo's Blog</span>
          </a>
        </h1>
      </div>
      <div class="site-actions">
        <nav class="site-nav">
          <a href="index.html">首页</a>
          <a href="pyq.html" style="background:var(--primary);color:#fff;">随笔</a>
          <a href="index.html#series">系列</a>
          <a href="index.html#archive">归档</a>
          <a href="index.html#categories">分类</a>
          <a href="index.html#friends">友链</a>
          <a href="profile.html">个人中心</a>
        </nav>
        <button id="theme-toggle" class="theme-btn">☀</button>
      </div>
    </div>
  </header>

  <main class="content" style="max-width:720px;margin:0 auto;">
    <section class="intro">
      <h2>我的随笔 · 朋友圈</h2>
    </section>
    <div id="notesList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/music_player.js"></script>
  <script src="assets/switch_bg.js"></script>
  <!-- 背景图片切换控件 -->
  <script>
    fetch('assets/switch_bg.html')
      .then(res => res.text())
      .then(html => {
        document.body.insertAdjacentHTML('beforeend', html)
        initBgSwitch();
      })
  </script>
  <script>
  // ====================== 配置 ======================
const BASE_URL = "./pyq/";
const IMAGE_BASE = BASE_URL + "images/";
// ==================================================

const notesList = document.getElementById("notesList");
const imgPreviewMask = document.getElementById("imgPreviewMask");
const previewImg = document.getElementById("previewImg");
const previewTip = document.getElementById("previewTip");

// 预览图全局状态
let previewState = {
  currentList: [],
  currentIndex: 0
};

// 显示提示
function showTip(text) {
  previewTip.innerText = text;
  previewTip.classList.add("show");
  setTimeout(() => {
    previewTip.classList.remove("show");
  }, 1200);
}

// 打开预览
window.openImgPreview = (src) => {
  const img = document.querySelector(`img[src="${src}"]`);
  const gallery = img.closest('.moment-images');
  const allImgs = Array.from(gallery.querySelectorAll('img'));
  
  previewState.currentList = allImgs.map(i => i.src);
  previewState.currentIndex = allImgs.indexOf(img);
  
  showPreviewImage();
  imgPreviewMask.classList.add("show");
};

// 显示当前索引图片
function showPreviewImage() {
  previewImg.src = previewState.currentList[previewState.currentIndex];
}

// 上一张
window.prevImage = () => {
  if (previewState.currentIndex <= 0) {
    showTip("🤚 别看了，已经到第一张了~");
    return;
  }
  previewState.currentIndex--;
  showPreviewImage();
};

// 下一张
window.nextImage = () => {
  if (previewState.currentIndex >= previewState.currentList.length - 1) {
    showTip("✌️ 别看了，已经到最后一张了~");
    return;
  }
  previewState.currentIndex++;
  showPreviewImage();
};

// 关闭预览
imgPreviewMask.onclick = (e) => {
  if (e.target === imgPreviewMask) {
    imgPreviewMask.classList.remove("show");
  }
};

// 键盘左右键切换
document.addEventListener('keydown', (e) => {
  if (!imgPreviewMask.classList.contains('show')) return;
  if (e.key === 'ArrowLeft') prevImage();
  if (e.key === 'ArrowRight') nextImage();
});

window.addEventListener("DOMContentLoaded", loadNotesFromJson);

async function loadNotesFromJson() {
  notesList.innerHTML = "<p>正在加载随笔...</p>";
  try {
    const res = await fetch(BASE_URL + "pyq_list.json");
    const jsonData = await res.json();
    const pyqList = jsonData.pyq_list;

    if (!pyqList || pyqList.length === 0) {
      notesList.innerHTML = "<p>暂无随笔</p>";
      return;
    }

    notesList.innerHTML = "";
    for (const item of pyqList) {
      await renderSingleNote(item);
    }
  } catch (err) {
    notesList.innerHTML = "<p>加载失败</p>";
    console.error(err);
  }
}

async function renderSingleNote(item) {
  try {
    const { file, timeCode, images } = item;
    const timeStr = `${timeCode.slice(0,4)}-${timeCode.slice(4,6)}-${timeCode.slice(6,8)} ${timeCode.slice(9,11)}:${timeCode.slice(11,13)}`;

    const mdRes = await fetch(BASE_URL + file);
    const mdText = await mdRes.text();
    const content = marked.parse(mdText);

    const imgUrls = images.map(img => `${IMAGE_BASE}${timeCode}/${img}`);

    const imgHtml = imgUrls.length
      ? `
      <div class="moment-images img-${imgUrls.length}">
        ${imgUrls.map(u => `<img src="${u}" onclick="openImgPreview('${u}')">`).join("")}
      </div>
      `
      : "";

    const card = document.createElement("div");
    card.className = "moment-card";
    card.innerHTML = `
      <div class="moment-header">
        <img src="assets/images/avatar.png" class="moment-avatar">
        <span class="moment-name">Leo</span>
      </div>
      <div class="moment-text">${content}</div>
      ${imgHtml}
      <div class="moment-time">${timeStr}</div>
    `;
    notesList.appendChild(card);
  } catch (e) {}
}
</script>
</body>
</html>
